# Production compose for vetdata.com.br
#
# Stack:
#   - caddy     : reverse proxy + automatic HTTPS (Let's Encrypt)
#   - frontend  : React SPA served by nginx (build-time VITE_* baked in)
#   - backend   : FastAPI (uvicorn), runs Alembic migrations on startup
#   - db        : Postgres 15 with a named volume
#
# Only Caddy publishes ports to the host (80 + 443). Backend and
# frontend are reachable only via the internal docker network, so
# the droplet's UFW only needs 22, 80, 443.
#
# Bring up:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:15-alpine
    container_name: vetdata_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetdata}
      POSTGRES_USER: ${POSTGRES_USER:-vetdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vetdata} -d ${POSTGRES_DB:-vetdata}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetdata_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetdata_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - vetdata_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${VITE_GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: vetdata_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - vetdata_internal

  caddy:
    image: caddy:2-alpine
    container_name: vetdata_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vetdata_internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  vetdata_internal:
    driver: bridge
